name: Encrypted off-site backup
on:
  schedule:
    - cron: '23 5,17 * * *'
  workflow_dispatch:
    inputs:
      initialize:
        description: 'Initialize the preconfigured EMPTY private repository (first run only)'
        type: boolean
        default: false
      full_check:
        description: 'Download and verify all retained repository data'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: the-lab-offsite-backup
  cancel-in-progress: false
jobs:
  backup:
    # Remains explicitly unconfigured until credentials AND first-run verification are ready.
    if: github.event_name == 'workflow_dispatch' || vars.BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: backups
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node --test scripts/backup/core.test.mjs
      - name: Install database and encryption tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18 restic
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
      - name: Export, encrypt, upload, download and verify
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_DB_CA_PEM: ${{ secrets.BACKUP_DB_CA_PEM }}
          BACKUP_STORAGE_SERVICE_KEY: ${{ secrets.BACKUP_STORAGE_SERVICE_KEY }}
          RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          INITIALIZE: ${{ inputs.initialize }}
          FULL_CHECK: ${{ inputs.full_check }}
        run: |
          args=()
          if [ "$INITIALIZE" = 'true' ]; then args+=(--init); fi
          if [ "$FULL_CHECK" = 'true' ] || [ "$(date -u +%u)" = '7' ]; then args+=(--full-check); fi
          node scripts/backup/run.mjs "${args[@]}"
      - name: Status
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'Backup result: %s.\nNo user data is included in GitHub artifacts or logs.\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" != 'success' ]; then
            echo '::error::Off-site backup is NOT verified. Existing backups were not deleted. Investigate before relying on this run.'
          fi
